version: "3.9"

services:
  database:
    image: postgres:15
    networks:
      - global
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d charge_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: charge_db
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host

  server:
    image: charge-images/chargemanager:1.0
    ports:
      - "8080:8080"
    deploy:
      replicas: 1
    depends_on:
      - database

networks:
  global:
    driver: overlay

volumes:
  postgres_data:
