version: "3.9"

services:

  chargerdatabase:
    image: postgres:15
    networks:
      - app-charger-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: charge_db
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host

  chargemaneger:
    image: charge-images/chargemanager:1.0
    networks:
      - app-charger-net
    depends_on:
      - chargerproxy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: charge_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      MAIL_USER: chargermanagerpb@gmail.com
      MAIL_PASSWORD: kegozvwhzyosiwam
    deploy:
      replicas: 1
      restart_policy:
        condition: none

networks:
  app-charger-net:
    external: true

volumes:
  postgres_data:
